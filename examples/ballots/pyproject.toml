[project]
name = "teabot-ballots"
version = "0.1.0"
description = "The tutorial's plugin: ballots with a job that posts the results"
requires-python = ">=3.12"
dependencies = ["teabot"]

[project.entry-points."teabot.plugins"]
ballots = "teabot_ballots:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot_ballots"]

[tool.uv.sources]
teabot = { workspace = true }
