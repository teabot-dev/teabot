[project]
name = "teabot"
version = "1.16.0.dev0"
description = "An open-source, plugin-based Discord bot."
keywords = ["discord", "bot", "plugins", "mcp", "self-hosted"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<0.33",
    "discord-py>=2.6",
    "mcp>=2.3,<3",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "starlette>=0.47",
    "typer>=0.29",
    "typing-extensions>=4.12",
    "uvicorn>=0.35",
    "watchfiles>=1.0",
    "httpx>=0.28",
    "packaging>=24",
    "markdown-it-py>=3",
]


[project.urls]
Homepage = "https://github.com/teabot-dev/teabot"
Documentation = "https://teabot-dev.github.io/teabot/"
Changelog = "https://github.com/teabot-dev/teabot/blob/main/CHANGELOG.md"
Issues = "https://github.com/teabot-dev/teabot/issues"

[project.optional-dependencies]
# Voice for plugins that play audio (D54). discord.py 2.7 never calls davey 0.2's transition methods, so with
# davey 0.2 every listener hears silence (S8); the pin lifts once discord.py supports it.
voice = [
    "discord-py[voice]>=2.6",
    "davey>=0.1,<0.2",
]
testing = [
    "psycopg[binary]>=3.3",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-postgresql>=10.0",
]

[project.scripts]
teabot = "teabot.cli:app"

# The first-party plugins ship inside teabot, and load through the same entry points as any other (D44).
[project.entry-points."teabot.plugins"]
announcements = "teabot.plugins.announcements:plugin"
roles = "teabot.plugins.roles:plugin"
tickets = "teabot.plugins.tickets:plugin"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "coverage>=7.10",
    "import-linter>=2.16",
    "pillow>=11",
    "psycopg[binary]>=3.3",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-postgresql>=10.0",
    "ruff>=0.17",
    "teabot-devtools",
    "teabot-ballots",
    "teabot[voice]",
]
docs = ["zensical==0.1.1"]
duplicate-check = ["teabot-devtools-twin"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot"]

[tool.uv.workspace]
members = ["plugins/*", "examples/*"]

[tool.uv.sources]
teabot-devtools = { workspace = true }
teabot-ballots = { workspace = true }
teabot-devtools-twin = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts/release"]
include = ["*.py", "*.pyi"]
# The scaffold rendered for the docs is checked as an instance's code, where teabot is a third-party package.
extend-exclude = ["tests/docs/scaffold"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "RUF", "ASYNC", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["teabot", "teabot_devtools", "teabot_devtools_twin", "teabot_ballots"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0917"]
# A plugin action's inputs are its parameters, so an action with six inputs takes six arguments.
"src/teabot/plugins/**" = ["PLR0913", "PLR0917"]
"plugins/*/src/**" = ["PLR0913", "PLR0917"]
"examples/*/src/**" = ["PLR0913", "PLR0917"]
# The fakes take discord.py's own keyword arguments, so each stands in for the real method.
"src/teabot/testing/fakes.py" = ["PLR0913"]
# A post's send and edit take Discord's own optional parts by keyword: text, embed, pings, files, buttons, a menu.
"src/teabot/sdk/guild.py" = ["PLR0913"]
"src/teabot/sdk/_views.py" = ["PLR0913"]
"src/teabot/sdk/db.py" = ["PLR0913"]
"src/teabot/sdk/http.py" = ["PLR0913"]
# @plugin.action takes each of its options by keyword: risk, needs, name, reply, surfaces and menu.
"src/teabot/sdk/authoring.py" = ["PLR0913"]
"src/teabot/db/pool.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60
max-nested-blocks = 3

[tool.pyright]
include = ["src", "tests", "plugins", "examples", "scripts"]
# The scaffold rendered for the docs, checked by tests/docs, imports a package that is not installed.
exclude = ["tests/docs/scaffold"]
# The release scripts import release_lib from their own directory.
extraPaths = ["scripts/release"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests", "plugins", "examples"]
pythonpath = ["scripts/release"]
addopts = "-p teabot.testing.fixtures"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# discord.py's escape_markdown passes re.sub's count positionally, which Python 3.13 deprecates. Only that one
# warning from that one module is hidden, so teabot's own warnings still show.
filterwarnings = ["ignore:'count' is passed as positional argument:DeprecationWarning:discord.utils"]

[tool.importlinter]
root_packages = ["teabot", "teabot_devtools", "teabot_ballots"]

[[tool.importlinter.contracts]]
name = "The plugin SDK does not depend on the core's internals (D45)"
type = "forbidden"
source_modules = ["teabot.sdk"]
forbidden_modules = [
    "teabot.adapters",
    "teabot.app",
    "teabot.assembly",
    "teabot.auth",
    "teabot.builtin",
    "teabot.catalogue",
    "teabot.cli",
    "teabot.site",
    "teabot.core",
    "teabot.db",
    "teabot.envfile",
    "teabot.health",
    "teabot.lint",
    "teabot.logs",
    "teabot.plugins",
    "teabot.runtime",
    "teabot.settings",
    "teabot.testing",
    "teabot.watchdog",
    "teabot.web",
]

[[tool.importlinter.contracts]]
name = "First-party plugins import only the SDK (D45)"
type = "forbidden"
source_modules = ["teabot.plugins", "teabot_devtools", "teabot_ballots"]
forbidden_modules = [
    "teabot.adapters",
    "teabot.app",
    "teabot.assembly",
    "teabot.auth",
    "teabot.builtin",
    "teabot.catalogue",
    "teabot.cli",
    "teabot.site",
    "teabot.core",
    "teabot.db",
    "teabot.envfile",
    "teabot.health",
    "teabot.lint",
    "teabot.logs",
    "teabot.runtime",
    "teabot.settings",
    "teabot.testing",
    "teabot.watchdog",
    "teabot.web",
]

[[tool.importlinter.contracts]]
name = "The core does not depend on its plugins, which it loads through entry points (D44)"
type = "forbidden"
source_modules = [
    "teabot.adapters",
    "teabot.app",
    "teabot.assembly",
    "teabot.auth",
    "teabot.builtin",
    "teabot.catalogue",
    "teabot.cli",
    "teabot.site",
    "teabot.core",
    "teabot.db",
    "teabot.runtime",
    "teabot.testing",
    "teabot.watchdog",
    "teabot.web",
]
forbidden_modules = ["teabot.plugins"]
