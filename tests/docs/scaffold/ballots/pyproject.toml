[project]
name = "teabot-ballots"
version = "0.1.0"
description = "A teabot plugin"
requires-python = ">=3.12"
dependencies = ["teabot>=1.0,<2"]

[project.entry-points."teabot.plugins"]
ballots = "teabot_ballots:plugin"

[dependency-groups]
dev = ["teabot[testing]"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot_ballots"]

[tool.pytest.ini_options]
addopts = "-p teabot.testing.fixtures"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
